openapi: 3.0.3
info:
  title: HEB Legal OCR & AI Autofill API
  description: |
    API contract for the HEB Legal OCR system and AI Autofill feature.
    
    This API provides endpoints for:
    - Processing legal documents (PDF extraction and OCR)
    - Querying legal obligations from processed documents
    - AI-powered form autofill functionality
    - Document management
    
    The frontend AI Fill functionality allows users to:
    - Search through legal documents for relevant information
    - Get AI-generated suggestions for form fields
    - Apply snippets to form fields with field mappings
    - Track document selection and snippet application

servers:
  - url: http://localhost:8000
    description: Local development server


tags:
  - name: Health
    description: Health check and service status endpoints
  - name: Documents
    description: Document management and processing endpoints
  - name: Query
    description: Query legal obligations from processed documents
  - name: Processing
    description: Document processing and OCR endpoints

paths:
  
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the API and query system
      operationId: healthCheck
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                    example: healthy
                  query_system:
                    type: string
                    example: initialized
                  documents_available:
                    type: integer
                    example: 5
                  gcs_output_path:
                    type: string
                    example: gs://heb-legal/Output
                  error:
                    type: string
                    nullable: true
        '503':
          description: Query system not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /documents:
    get:
      tags:
        - Documents
      summary: List all available processed documents
      description: Returns a list of all consolidated JSON documents with metadata
      operationId: listDocuments
      responses:
        '200':
          description: List of available documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_documents:
                    type: integer
                    example: 3
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentMetadata'
        '500':
          description: Error listing documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Query system not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /query:
    get:
      tags:
        - Query
      summary: Query legal obligations (GET)
      description: |
        Searches through all consolidated JSON files and returns relevant obligations
        ranked by relevance and monetary value.
        
        If no query is provided (empty string), returns all utility-related obligations including:
        water, gas, heat, light, electricity, telephone service, HVAC, sprinkler system,
        electrical and plumbing systems.
      operationId: queryObligationsGet
      parameters:
        - name: q
          in: query
          required: false
          description: Search query for legal obligations (if empty, returns utility-related obligations)
          schema:
            type: string
            default: ""
            example: "Rent payment"
        - name: save_output
          in: query
          required: false
          description: Whether to save results to file
          schema:
            type: boolean
            default: false
        - name: output_folder
          in: query
          required: false
          description: GCS output folder to search in (if not provided, uses default from environment)
          schema:
            type: string
            nullable: true
            example: "Output"
      responses:
        '200':
          description: Query results with matched obligations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '500':
          description: Error processing query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Query system not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Query
      summary: Query legal obligations (POST)
      description: |
        Searches through all consolidated JSON files and returns relevant obligations
        ranked by relevance and monetary value.
        
        If no query is provided (empty string), returns all utility-related obligations including:
        water, gas, heat, light, electricity, telephone service, HVAC, sprinkler system,
        electrical and plumbing systems.
      operationId: queryObligationsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query results with matched obligations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '500':
          description: Error processing query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Query system not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /process:
    post:
      tags:
        - Processing
      summary: Process legal documents
      description: |
        Extracts text from PDF documents in the specified GCS folder and analyzes
        financial obligations using Google Gemini AI. Results are saved to the
        specified output folder.
      operationId: processDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequest'
      responses:
        '200':
          description: Document processing results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResponse'
        '500':
          description: Error processing document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

 