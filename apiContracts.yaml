openapi: 3.0.3
info:
  title: HEB Legal OCR & AI Autofill API
  version: 1.0.0
  description: |
    API for processing legal documents, extracting obligations, and providing AI-powered form autofill functionality.
    
    Key features:
    - Document processing and OCR
    - Legal obligation querying and search
    - AI-generated form field suggestions
    - Document metadata management

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Health
    description: Service health and status
  - name: Documents
    description: Document management
  - name: Query
    description: Legal obligation search and retrieval
  - name: Processing
    description: Document processing and OCR

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API and query system
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service unavailable

  /documents:
    get:
      tags:
        - Documents
      summary: List documents
      description: Returns a list of all processed documents with metadata
      operationId: listDocuments
      responses:
        '200':
          description: List of available documents
        '500':
          description: Internal server error
        '503':
          description: Service unavailable

  /query:
    get:
      tags:
        - Query
      summary: Query legal obligations
      description: |
        Searches through processed documents and returns relevant legal obligations.
        Results are ranked by relevance and monetary value.
        
        If no query is provided, returns utility-related obligations (water, gas, heat, 
        light, electricity, telephone, HVAC, sprinkler systems, electrical and plumbing).
      operationId: queryObligationsGet
      parameters:
        - name: q
          in: query
          required: false
          description: Search query string. Empty string returns utility-related obligations.
          schema:
            type: string
            default: ""
            example: "Rent payment"
        - name: output_folder
          in: query
          required: false
          description: Output folder path (optional, uses default if not provided)
          schema:
            type: string
            nullable: true
            example: "Output"
      responses:
        '200':
          description: Query results
        '500':
          description: Internal server error
        '503':
          description: Service unavailable

    post:
      tags:
        - Query
      summary: Query legal obligations (POST)
      description: |
        Searches through processed documents and returns relevant legal obligations.
        Results are ranked by relevance and monetary value.
        
        If no query is provided, returns utility-related obligations (water, gas, heat, 
        light, electricity, telephone, HVAC, sprinkler systems, electrical and plumbing).
      operationId: queryObligationsPost
      requestBody:
        required: true
      responses:
        '200':
          description: Query results
        '500':
          description: Internal server error
        '503':
          description: Service unavailable

  /process:
    post:
      tags:
        - Processing
      summary: Process documents
      description: Extracts text from PDF documents and analyzes financial obligations
      operationId: processDocument
      requestBody:
        required: true
      responses:
        '200':
          description: Processing completed successfully
        '500':
          description: Internal server error
